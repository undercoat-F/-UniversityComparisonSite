name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: ${{ secrets.VPS_HOST != '' && secrets.VPS_USER != '' && secrets.VPS_SSH_KEY != '' }}

    steps:
      - name: Deploy by SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd "${{ secrets.VPS_APP_DIR }}"
            git pull origin main
            docker compose up -d --build

  verify:
    name: Post-deploy health check
    runs-on: ubuntu-latest
    needs:
      - deploy-render
      - deploy-vps
    if: ${{ always() }}

    steps:
      - name: Check API health endpoint
        if: ${{ secrets.HEALTHCHECK_URL != '' }}
        run: |
          curl -fsS "${{ secrets.HEALTHCHECK_URL }}"

      - name: Skip health check if not configured
        if: ${{ secrets.HEALTHCHECK_URL == '' }}
        run: echo "HEALTHCHECK_URL is not set; skipped."
